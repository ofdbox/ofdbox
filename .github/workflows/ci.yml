name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      corpus_dir:
        description: "自托管 Runner 上的 OFD 语料目录（留空则不跑语料兼容性）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ofdbox --no-default-features
      - run: cargo check -p ofdbox --no-default-features --features crypto
      - run: cargo check -p ofdbox --no-default-features --features seal
      - run: cargo check -p ofdbox --all-features
      - run: cargo check -p ofdbox-core --target wasm32-unknown-unknown
      - run: cargo check -p ofdbox-crypto --target wasm32-unknown-unknown
      - run: cargo check -p ofdbox-seal --target wasm32-unknown-unknown
      - run: cargo check -p ofdbox --target wasm32-unknown-unknown --no-default-features --features crypto
      - run: cargo test -p ofdbox-algo --features x509 --locked

  corpus:
    name: corpus compatibility
    # 只在手动触发且提供语料目录时运行；普通 CI 不依赖外部文档。
    if: github.event_name == 'workflow_dispatch' && inputs.corpus_dir != ''
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ofdbox --test corpus_compat --locked -- --ignored --nocapture
        env:
          OFDBOX_TESTDATA_DIR: ${{ inputs.corpus_dir }}
