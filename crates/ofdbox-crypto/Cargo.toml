ofdbox-algo = { path = "../ofdbox-algo", version = "0.1.0" }
ofdbox-core = { path = "../ofdbox-core", version = "0.0.1" }
der.workspace = true
md-5.workspace = true
sha1.workspace = true
sm2.workspace = true
sm3.workspace = true
sm4.workspace = true
thiserror.workspace = true
x509-cert.workspace = true
zeroize.workspace = true
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom.workspace = true

[dev-dependencies]
base64.workspace = true
x509-cert = { workspace = true, features = ["builder"] }
