[package]
name = "ofdbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ofd", "layout-document", "gb-t-33190", "gm-t-0099", "document"]
categories = ["text-processing", "parser-implementations"]
description = "基于 GB/T 33190—2016 与 GM/T 0099—2020 的 OFD 结构、加密与签章工具箱。"

[features]
default = ["crypto", "seal"]
crypto = ["dep:ofdbox-crypto"]
seal = ["dep:ofdbox-seal"]
full = ["crypto", "seal"]

[dependencies]
ofdbox-algo = { path = "../ofdbox-algo", version = "0.1.0" }
ofdbox-core = { path = "../ofdbox-core", version = "0.0.1" }
ofdbox-crypto = { path = "../ofdbox-crypto", version = "0.0.1", optional = true }
ofdbox-seal = { path = "../ofdbox-seal", version = "0.0.1", optional = true }
thiserror.workspace = true

[dev-dependencies]
der.workspace = true
sm2.workspace = true
x509-cert = { workspace = true, features = ["builder"] }
zip.workspace = true
