[package]
name = "ofdbox-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ofd", "pdf", "rendering", "conversion"]
categories = ["graphics", "text-processing"]
description = "OFD 页面渲染与格式转换的统一 Scene IR、前后端和 CPU 光栅化。"

[features]
default = ["ofd", "pdf", "cpu", "image"]
ofd = ["dep:ofdbox-core", "dep:zip"]
pdf = ["dep:lopdf", "dep:kurbo", "image-png"]
cpu = ["dep:vello_cpu"]
image = [
    "image-png",
    "image-jpeg",
    "image-bmp",
    "image-tiff",
    "image-jbig2",
    "image-ccitt",
]
image-png = ["dep:png"]
image-jpeg = ["dep:jpeg-decoder"]
image-bmp = ["dep:bmp"]
image-tiff = ["dep:tiff"]
image-jbig2 = ["dep:justbig2"]
image-ccitt = ["dep:hayro-ccitt"]
wgpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
bmp = { version = "0.5", optional = true }
flate2 = "1"
hayro-ccitt = { version = "0.3.0", optional = true }
jpeg-decoder = { version = "0.3", optional = true }
justbig2 = { version = "0.2", optional = true }
kurbo = { version = "0.13", optional = true }
lopdf = { version = "0.45.0", features = ["wasm_js"], optional = true }
ofdbox-core = { path = "../ofdbox-core", version = "0.0.1", optional = true }
png = { version = "0.18", optional = true }
pollster = { version = "1", optional = true }
skrifa = "0.44"
sm3.workspace = true
thiserror.workspace = true
tiff = { workspace = true, optional = true }
ttf-parser = "0.25"
vello_cpu = { version = "0.3.0", optional = true }
wgpu = { version = "30", optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
dotenvy.workspace = true
eframe = "0.33"
rfd = "0.17"



